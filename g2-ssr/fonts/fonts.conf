<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <dir>.</dir>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Droid Sans Fallback</family></prefer>
  </alias>
  <match target="pattern">
    <test name="family" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="prepend"><string>Droid Sans Fallback</string></edit>
  </match>
</fontconfig>
