services:
  # MySQL数据库（元库 nl2sql_db）
  # 混合开发：宿主 IDEA 连库时需要 3306 映射。当前运行中的容器若无端口，用
  #   bash scripts/dev-hybrid.sh up  （socat 转发，不 recreate、不丢数据）
  # 若 recreate 本服务：务必先确认 volumes 已启用，否则数据丢失。
  mysql:
    image: mysql:8.0
    container_name: data-agent-mysql-inner
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nl2sql_db
    ports:
      - "3306:3306"
    # 命名卷：recreate/restart 后保留 nl2sql_db。切勿 docker compose down -v。
    volumes:
      - data-agent-mysql-inner-data:/var/lib/mysql
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # 后端服务
  backend:
    build:
      context: ..
      dockerfile: ./docker-file/Dockerfile-backend
      tags:
        - saa-data-agent-backend:1.0.0-SNAPSHOT
    container_name: data-agent-backend
    environment:
      - DATA_AGENT_DATASOURCE_URL=jdbc:mysql://mysql:3306/nl2sql_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - DATA_AGENT_DATASOURCE_USERNAME=root
      - DATA_AGENT_DATASOURCE_PASSWORD=root
      - DATA_AGENT_DATASOURCE_SQL_INIT=always
      - AI_DASHSCOPE_API_KEY=${AI_DASHSCOPE_API_KEY}
    ports:
      - "8065:8065"
    depends_on:
      mysql:
        condition: service_healthy
      mysql-data:
        condition: service_healthy
      postgres-data:
        condition: service_healthy
    networks:
      - app-network
    restart: no

  # Vue前端服务
  frontend:
    build:
      context: ..
      dockerfile: ./docker-file/Dockerfile-frontend
      tags:
        - saa-data-agent-frontend:1.0.0-SNAPSHOT
    container_name: data-agent-frontend
    ports:
      - "3301:3301"  # 公网访问前端端口
    depends_on:
      - backend
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - app-network
    restart: unless-stopped

  # MySQL 模拟数据源
  mysql-data:
    image: mysql:8.0
    container_name: data-agent-mysql-datasource
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
    networks:
      - app-network
    volumes:
      - ./config/mysql:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL 模拟数据源
  postgres-data:
    image: postgres:15
    container_name: data-agent-postgres-datasource
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    networks:
      - app-network
    volumes:
      - ./config/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  # 固定卷名 + external：recreate 复用已有卷，避免 compose 前缀空卷
  data-agent-mysql-inner-data:
    name: data-agent-mysql-inner-data
    external: true

networks:
  app-network:
    driver: bridge
    name: "data-agent-network"
