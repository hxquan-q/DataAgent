# =============================================================================
# DataAgent Management 主配置文件（默认 Profile）
# 说明：本文件管理 DataAgent 服务自身的运行参数。
# 注意：下方 spring.datasource 存的是「业务元数据」（Agent、数据源配置、会话等），
#       不是用户让 Agent 去分析的业务库。
# =============================================================================

# -----------------------------------------------------------------------------
# 服务端口
# -----------------------------------------------------------------------------
server:
  # HTTP 服务监听端口
  port: 8065

# -----------------------------------------------------------------------------
# SpringDoc / Swagger UI（API 文档）
# -----------------------------------------------------------------------------
springdoc:
  api-docs:
    # OpenAPI JSON 文档访问路径
    path: /v3/api-docs
  swagger-ui:
    # Swagger UI 页面路径，启动后访问 http://localhost:8065/swagger-ui.html
    path: /swagger-ui.html

# -----------------------------------------------------------------------------
# Spring 核心配置
# -----------------------------------------------------------------------------
spring:
  # ---------------------------------------------------------------------------
  # 数据源：存储 DataAgent 业务元数据（非 Agent 分析的目标业务库）
  # 支持通过环境变量覆盖，便于容器/多环境部署
  # ---------------------------------------------------------------------------
  datasource:
    # JDBC 连接串；可用 DATA_AGENT_DATASOURCE_URL 覆盖
    url: ${DATA_AGENT_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/saa_data_agent?useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowMultiQueries=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai}
    # 数据库用户名；可用 DATA_AGENT_DATASOURCE_USERNAME 覆盖
    username: ${DATA_AGENT_DATASOURCE_USERNAME:root}
    # 数据库密码；可用 DATA_AGENT_DATASOURCE_PASSWORD 覆盖
    password: ${DATA_AGENT_DATASOURCE_PASSWORD:root}
    # MySQL 8.x 驱动
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 使用 Druid 连接池
    type: com.alibaba.druid.pool.DruidDataSource

  # ---------------------------------------------------------------------------
  # SQL 初始化（建表 + 初始数据）
  # mode 常用值：never（不执行）| always（每次启动执行）| embedded（仅嵌入式库）
  # ---------------------------------------------------------------------------
  sql:
    init:
      # 默认 never，生产环境避免误执行；本地可用环境变量改为 always
      mode: ${DATA_AGENT_DATASOURCE_SQL_INIT:never}
      # 表结构脚本
      schema-locations: classpath:sql/schema.sql
      # 初始数据脚本
      data-locations: classpath:sql/data.sql
      # 单条 SQL 失败时继续执行后续语句
      continue-on-error: true
      # SQL 语句分隔符
      separator: ;
      # 脚本文件编码
      encoding: utf-8

  # ---------------------------------------------------------------------------
  # Spring AI / DataAgent 业务配置
  # ---------------------------------------------------------------------------
  ai:
    # 向量存储类型：simple 为内存实现，适合开发；生产可换 pgvector 等
    vectorstore:
      type: simple
    alibaba:
      data-agent:
        # 向量检索相关阈值
        vector-store:
          # 表级召回：返回最相似的 Top-K 张表
          table-topk-limit: 10
          # 表级相似度下限（低于此值的结果丢弃）
          table-similarity-threshold: 0.2
          # 通用召回 Top-K
          default-topk-limit: 8
          # 通用相似度下限
          default-similarity-threshold: 0.4
        # LLM 调用方式：stream（流式）| block（阻塞）
        llm-service-type: stream
        # 语义层缓存定时刷新间隔（毫秒），默认 5 分钟
        semantic-layer:
          refresh-interval: 300000
        # Python 代码执行器配置
        code-executor:
          # 运行环境：local（本机，仅开发）| docker（生产推荐）
          code-pool-executor: local
          # Python 执行失败后的最大重试次数
          python-max-tries-count: 5
        # 网页嵌入 embed 配置
        embed:
          # 会话令牌 HMAC 签名密钥（⚠️ 生产必须改为随机 32+ 字节串；本地开发用默认值）
          token-hmac-key: dataagent-embed-dev-hmac-key-change-in-prod
          # 会话令牌有效期（秒），默认 30 分钟
          session-ttl-seconds: 1800
          # 每 Agent 每分钟请求上限（R1 单层兜底，R3 起三层）
          rate-limit-per-minute: 30
        # 文件存储配置
        file:
          # 存储类型：local（本地磁盘）| oss（阿里云 OSS）
          type: local
          # 路径前缀（逻辑目录名）
          path-prefix: data-agent
          # 本地物理目录；不要写成 ./uploads，Windows 下路径拼接会解析失败
          path: uploads
          # 对外访问 URL 前缀
          url-prefix: /uploads
          # 图片最大字节数（默认 2MB = 2097152）
          imageSize: 2097152
          # OSS 配置（type=oss 时生效，建议用环境变量注入密钥）
          oss:
            access-key-id: ${OSS_ACCESS_KEY_ID:}
            access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
            endpoint: ${OSS_ENDPOINT:}
            bucket-name: ${OSS_BUCKET_NAME:}
            # 自定义域名（CDN/绑定域名时使用，可为空）
            custom-domain: ${OSS_CUSTOM_DOMAIN:}
        # SQL 生成/执行失败时的最大重试次数
        max-sql-retry-count: 10
        # Langfuse 可观测性（链路追踪、Prompt/LLM 调用监控）
        langfuse:
          # 是否启用；可用 LANGFUSE_ENABLED 覆盖
          enabled: ${LANGFUSE_ENABLED:false}
          # Langfuse 服务地址
          host: ${LANGFUSE_HOST:}
          # 公钥
          public-key: ${LANGFUSE_PUBLIC_KEY:}
          # 私钥（勿提交真实密钥到仓库）
          secret-key: ${LANGFUSE_SECRET_KEY:}

  # ---------------------------------------------------------------------------
  # WebFlux 文件上传限制（本模块基于 WebFlux）
  # ---------------------------------------------------------------------------
  webflux:
    multipart:
      # 单个文件最大大小
      max-file-size: 10MB
      # 单次请求最大大小
      max-request-size: 10MB
      # 是否启用 multipart 解析
      enabled: true

# -----------------------------------------------------------------------------
# MyBatis 配置
# -----------------------------------------------------------------------------
mybatis:
  configuration:
    # 数据库下划线字段自动映射为 Java 驼峰属性
    map-underscore-to-camel-case: true
    # SQL 日志输出到 SLF4J
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# -----------------------------------------------------------------------------
# 日志：控制台 + 文件（logback-spring.xml）
# 活跃文件：logs/data-agent-{启动编码}.log
# 按日归档：logs/data-agent-yyyy-MM-dd-{启动编码}.log
# 启动编码 = 进程启动时刻 yyyyMMdd-HHmmss；目录已在 .gitignore（**/logs/*）
# -----------------------------------------------------------------------------
logging:
  file:
    path: ${LOG_PATH:logs}
  level:
    # 业务服务层
    com.alibaba.cloud.ai.dataagent.service: debug
    # 工作流节点
    com.alibaba.cloud.ai.dataagent.workflow.node: debug
    # MyBatis Mapper
    com.alibaba.cloud.ai.mapper: debug
    # JDBC 相关
    org.springframework.jdbc: debug
