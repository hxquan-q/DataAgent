# =============================================================================
# DataAgent Management H2 开发/测试配置（Profile: h2）
# 启用方式：--spring.profiles.active=h2
# 说明：使用内存 H2 数据库，适合本地快速启动与联调，无需外部 MySQL。
# 注意：进程退出后内存数据会丢失（DB_CLOSE_ON_EXIT=FALSE 仅延长到 JVM 结束前）。
# =============================================================================

# -----------------------------------------------------------------------------
# 服务端口
# -----------------------------------------------------------------------------
server:
  # HTTP 服务监听端口（与默认 Profile 一致，便于本地切换）
  port: 8065

# -----------------------------------------------------------------------------
# Spring 核心配置
# -----------------------------------------------------------------------------
spring:
  # ---------------------------------------------------------------------------
  # 数据源：H2 内存库，存储 DataAgent 业务元数据（非 Agent 分析目标库）
  # URL 参数说明：
  #   mem:nl2sql_database  - 内存库名
  #   DB_CLOSE_DELAY=-1    - 最后一个连接关闭后仍保留库
  #   DATABASE_TO_LOWER=true - 标识符转小写，贴近 MySQL 习惯
  #   MODE=MySQL           - 兼容 MySQL 语法
  #   DB_CLOSE_ON_EXIT=FALSE - JVM 退出前不立即销毁
  # ---------------------------------------------------------------------------
  datasource:
    url: jdbc:h2:mem:nl2sql_database;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=true;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
    username: root
    password: root
    # H2 驱动
    driver-class-name: org.h2.Driver
    # 使用 Druid 连接池
    type: com.alibaba.druid.pool.DruidDataSource

  # ---------------------------------------------------------------------------
  # SQL 初始化：H2 下每次启动都执行（mode=always）
  # ---------------------------------------------------------------------------
  sql:
    init:
      # 始终初始化，方便本地开箱即用
      mode: always
      # 表结构：核心 schema + 示例商品库 schema
      schema-locations:
        - classpath:sql/h2/schema-h2.sql
        - classpath:sql/h2/product_schema-h2.sql
      # 初始数据：核心数据 + 示例商品数据
      data-locations:
        - classpath:sql/h2/data-h2.sql
        - classpath:sql/h2/product_data-h2.sql
      # 单条失败不中断后续脚本
      continue-on-error: true
      separator: ;
      encoding: utf-8

  # ---------------------------------------------------------------------------
  # H2 控制台（仅开发环境；生产勿开）
  # 访问：http://localhost:8065/h2-console
  # JDBC URL 填上面 datasource.url，用户/密码 root/root
  # ---------------------------------------------------------------------------
  h2:
    console:
      enabled: true
      path: /h2-console

  # ---------------------------------------------------------------------------
  # Spring AI / DataAgent 业务配置（与默认 Profile 语义一致）
  # ---------------------------------------------------------------------------
  ai:
    # 向量存储：simple 内存实现，适合开发
    vectorstore:
      type: simple
    alibaba:
      data-agent:
        # 向量检索阈值
        vector-store:
          # 表级召回 Top-K
          table-topk-limit: 10
          # 表级相似度下限
          table-similarity-threshold: 0.2
          # 通用召回 Top-K
          default-topk-limit: 8
          # 通用相似度下限
          default-similarity-threshold: 0.4
        # LLM 调用方式：stream 流式
        llm-service-type: stream
        # Python 代码执行器
        code-executor:
          # local 仅开发；生产建议 docker
          code-pool-executor: local
          # Python 执行最大重试次数
          python-max-tries-count: 5
        # 网页嵌入 embed 配置
        embed:
          # 会话令牌 HMAC 密钥（生产必须修改）
          token-hmac-key: dataagent-embed-dev-hmac-key-change-in-prod
          # 会话令牌有效期（秒）
          session-ttl-seconds: 1800
          # 每 Agent 每分钟请求上限
          rate-limit-per-minute: 30
        # 文件存储
        file:
          # local=本地磁盘；oss=阿里云 OSS
          type: local
          path-prefix: data-agent
          # 不要用 ./uploads，Windows 路径拼接会失败
          path: uploads
          url-prefix: /uploads
          # 图片上限 2MB
          imageSize: 2097152
          # type=oss 时生效
          oss:
            access-key-id: ${OSS_ACCESS_KEY_ID:}
            access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
            endpoint: ${OSS_ENDPOINT:}
            bucket-name: ${OSS_BUCKET_NAME:}
            custom-domain: ${OSS_CUSTOM_DOMAIN:}
        # SQL 失败最大重试次数
        max-sql-retry-count: 10
        # Langfuse 可观测性
        langfuse:
          enabled: ${LANGFUSE_ENABLED:false}
          host: ${LANGFUSE_HOST:}
          public-key: ${LANGFUSE_PUBLIC_KEY:}
          secret-key: ${LANGFUSE_SECRET_KEY:}

  # ---------------------------------------------------------------------------
  # Servlet 文件上传限制（H2 Profile 下使用 servlet multipart）
  # ---------------------------------------------------------------------------
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true

# -----------------------------------------------------------------------------
# MyBatis 配置
# -----------------------------------------------------------------------------
mybatis:
  configuration:
    # 下划线转驼峰
    map-underscore-to-camel-case: true
    # SQL 日志走 SLF4J
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# -----------------------------------------------------------------------------
# 日志级别（开发 debug；生产建议 info）
# -----------------------------------------------------------------------------
logging:
  level:
    com.alibaba.cloud.ai.dataagent.service: debug
    com.alibaba.cloud.ai.dataagent.workflow.node: debug
    com.alibaba.cloud.ai.mapper: debug
    org.springframework.jdbc: debug
