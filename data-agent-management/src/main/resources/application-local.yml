# IDEA / 宿主本地开发 profile（Docker 只跑 MySQL）
# 启动：--spring.profiles.active=local
# 或 IDEA Active profiles = local
#
# 前置：MySQL 可从宿主访问 127.0.0.1:3306（compose 映射 或 socat 转发容器）
# 库名与 Docker 一致：nl2sql_db（不是 yml 默认的 saa_data_agent）

server:
  port: 8065

spring:
  datasource:
    url: ${DATA_AGENT_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/nl2sql_db?useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowMultiQueries=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${DATA_AGENT_DATASOURCE_USERNAME:root}
    password: ${DATA_AGENT_DATASOURCE_PASSWORD:root}
  # 已有库已建表；本地开发勿 always 冲刷
  sql:
    init:
      mode: never
  ai:
    alibaba:
      data-agent:
        # 本地性能：降 SQL 重试；关 SQL 结果后置图表 LLM（报告仍可出 echarts）
        max-sql-retry-count: 3
        enable-sql-result-chart: false
        enrich-sql-result-timeout: 2000
        # R149: 无依赖 SQL 波次并发（取舍：跳过逐步语义校验换墙钟）
        enable-concurrent-steps: true

# embed 开发默认密钥（生产必须改）
# spring.ai.alibaba.data-agent.embed.token-hmac-key 继承 application.yml
