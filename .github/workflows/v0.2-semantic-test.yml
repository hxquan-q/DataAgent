name: v0.2 Semantic Layer Test
on:
  push:
    branches:
      - 'v0.2/**'
  pull_request:
    branches:
      - 'v0.2/**'
permissions:
  contents: read
jobs:
  backend-semantic-test:
    name: Backend v0.2 Semantic Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-
      - name: Run v0.2 semantic tests
        working-directory: data-agent-management
        run: mvn -B test -Dtest='com.alibaba.cloud.ai.dataagent.service.semantic.*Test,com.alibaba.cloud.ai.dataagent.util.SqlGuardTest,com.alibaba.cloud.ai.dataagent.util.MemoryWindowUtilTest,com.alibaba.cloud.ai.dataagent.eval.GoldenQueryDataTest' -DfailIfNoTests=false
  frontend-build:
    name: Frontend v0.2 Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Install and build
        working-directory: data-agent-frontend-nuxt
        run: |
          pnpm install --frozen-lockfile
          pnpm build
